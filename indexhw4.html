<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="description">Заголовок</h1>
    <p class="description">Параграф</p>
    <button class="description">Кнопка</button>
    <script>
        const descriptionEl = document.querySelectorAll('.description');
        console.log('Найденный элемент',descriptionEl )
        descriptionEl.forEach(description => {
            description.textContent = 'Измененный текст';
        });
    </script>
</body>
</html>
